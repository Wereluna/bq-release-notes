<!DOCTYPE html>
<html>
<head>
<title>IncidentGuard AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image:linear-gradient(135deg,#120012,#000000,#220022);
}

.container{
    width:800px;
    padding:40px;
    border-radius:20px;
    background:rgba(20,20,20,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 0 30px #ff004c;
}

h1{
    text-align:center;
    color:#ff004c;
    font-size:3rem;
    text-shadow:0 0 20px #ff004c;
    margin-bottom:20px;
}

.subtitle{
    text-align:center;
    color:#ccc;
    margin-bottom:30px;
}

.upload-box{
    border:2px dashed #ff004c;
    padding:30px;
    border-radius:15px;
    text-align:center;
}

input[type=file]{
    color:white;
    margin-bottom:20px;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:10px;
    background:#ff004c;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    box-shadow:0 0 25px #ff004c;
    transform:scale(1.05);
}

.result{
    margin-top:30px;
    background:#160016;
    padding:25px;
    border-radius:15px;
    border-left:5px solid #ff004c;
}

.result h2{
    color:#ff004c;
    margin-bottom:10px;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
}
</style>

</head>
<body>

<div class="container">

<h1>🦇 IncidentGuard AI</h1>

<p class="subtitle">
Dark Intelligence • Threat Detection • Log Analysis
</p>

<div class="upload-box">
<form method="POST" enctype="multipart/form-data">

<input type="file" name="logfile" required>

<br>

<button type="submit">
Analyze Threat
</button>

</form>
</div>

{% if result %}
<div class="result">
<h2>Threat Report</h2>
<p>{{ result }}</p>
</div>
{% endif %}

<div class="footer">
Powered by IncidentGuard AI
</div>

</div>

</body>
</html>
